name: Update Snowfall Data

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Refresh snowfall data if stale
        run: npm run update-data

      - name: Commit and push data updates
        run: |
          if git diff --quiet -- data/snowfall-data.json data/USC00059175data.csv; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snowfall-data.json data/USC00059175data.csv
          git commit -m "chore(data): refresh snowfall data"
          git push
